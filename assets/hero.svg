<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">SEMO-diX</title>
  <desc id="desc">「覚えている」を、検証してから使う。コミットの線の上で、検証済みのコミットにだけ正本の判が押されている図。</desc>

  <style>
    .mincho {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Noto Serif CJK JP", serif;
    }
    .gothic {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
    }
    .stamp {
      transform-box: fill-box;
      transform-origin: center;
      animation: stamp .7s cubic-bezier(.2,.7,.2,1) .45s both;
    }
    .verified-dot {
      animation: ink .7s ease-out .45s both;
    }
    @keyframes stamp {
      0%   { opacity: 0; transform: scale(1.28) rotate(-5deg); }
      58%  { opacity: 1; transform: scale(.96) rotate(-2deg); }
      100% { opacity: 1; transform: scale(1) rotate(-2deg); }
    }
    @keyframes ink {
      0%   { fill: #9AA5B1; }
      100% { fill: #C8402F; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stamp, .verified-dot { animation: none; }
    }
  </style>

  <rect width="1200" height="400" rx="14" fill="#F2F4F6"/>

  <text class="mincho" x="64" y="132" font-size="54" fill="#1F3A5F" letter-spacing="2">「覚えている」を、</text>
  <text class="mincho" x="64" y="204" font-size="54" fill="#1F3A5F" letter-spacing="2">検証してから使う。</text>
  <text class="gothic" x="66" y="258" font-size="19" fill="#4A5968">SEMO-diX　AI駆動で開発し、LLMの外部記憶を作っています</text>

  <line x1="108" y1="334" x2="1124" y2="334" stroke="#C9D1D9" stroke-width="2"/>

  <g fill="#9AA5B1">
    <circle cx="120" cy="334" r="5"/>
    <circle cx="230" cy="334" r="5"/>
    <circle cx="340" cy="334" r="5"/>
    <circle cx="450" cy="334" r="5"/>
    <circle cx="560" cy="334" r="5"/>
    <circle cx="670" cy="334" r="5"/>
    <circle cx="780" cy="334" r="5"/>
    <circle cx="890" cy="334" r="5"/>
  </g>

  <g fill="#F2F4F6" stroke="#9AA5B1" stroke-width="2">
    <circle cx="1085" cy="334" r="6"/>
    <circle cx="1124" cy="334" r="6"/>
  </g>

  <line x1="1000" y1="246" x2="1000" y2="322" stroke="#C8402F" stroke-width="1.5" stroke-dasharray="3 5"/>
  <circle class="verified-dot" cx="1000" cy="334" r="9" fill="#C8402F"/>

  <g class="stamp" transform="translate(936 209) rotate(-2)">
    <circle cx="64" cy="0" r="43" fill="none" stroke="#C8402F" stroke-width="3"/>
    <circle cx="64" cy="0" r="37" fill="none" stroke="#C8402F" stroke-width="1" opacity=".65"/>
    <text class="mincho" x="64" y="10" font-size="26" font-weight="700" fill="#C8402F" text-anchor="middle">正本</text>
  </g>

  <text class="gothic" x="1000" y="373" font-size="14" fill="#C8402F" text-anchor="middle">verified checkpoint</text>
  <text class="gothic" x="1085" y="373" font-size="12" fill="#7B8794" text-anchor="middle">候補</text>
  <text class="gothic" x="1124" y="373" font-size="12" fill="#7B8794" text-anchor="middle">候補</text>
</svg>
